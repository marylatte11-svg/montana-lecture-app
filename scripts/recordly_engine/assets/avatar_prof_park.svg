<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGradPark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00205b"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blazerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGradPark)"/>
  
  <!-- Outer Gold Ring Accent (MSU Colors) -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="url(#goldAccent)" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Body / Blazer -->
  <path d="M26 160 C26 115 52 106 80 106 C108 106 134 115 134 160 Z" fill="url(#blazerGrad)"/>
  <!-- Blouse -->
  <polygon points="80,106 68,128 80,150 92,128" fill="#f8fafc"/>
  <circle cx="80" cy="130" r="3" fill="#f59e0b"/>

  <!-- Neck -->
  <rect x="72" y="88" width="16" height="22" fill="#fed7aa" rx="4"/>

  <!-- Head -->
  <ellipse cx="80" cy="66" rx="25" ry="30" fill="#fed7aa"/>

  <!-- Sleek Professional Black Hair -->
  <path d="M46 64 C42 90 44 125 48 135 C52 115 50 85 52 70 Z" fill="#1e1e24"/>
  <path d="M114 64 C118 90 116 125 112 135 C108 115 110 85 108 70 Z" fill="#1e1e24"/>
  <path d="M52 60 C50 36 64 30 80 30 C96 30 110 36 108 60 C100 40 90 38 80 38 C68 38 58 42 52 60 Z" fill="#1e1e24"/>

  <!-- Smart Glasses -->
  <rect x="62" y="58" width="15" height="11" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="83" y="58" width="15" height="11" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
  <line x1="77" y1="63" x2="83" y2="63" stroke="#f59e0b" stroke-width="1.8"/>

  <!-- Eyes -->
  <circle cx="70" cy="63" r="2" fill="#0f172a"/>
  <circle cx="90" cy="63" r="2" fill="#0f172a"/>

  <!-- Warm Instructor Smile -->
  <path d="M74 81 Q80 86 86 81" fill="none" stroke="#be185d" stroke-width="2" stroke-linecap="round"/>
</svg>
