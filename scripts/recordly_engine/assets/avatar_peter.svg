<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgGradPeter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="80" cy="80" r="80" fill="url(#bgGradPeter)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="80" cy="80" r="77" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 4"/>

  <!-- Body / Suit -->
  <path d="M25 160 C25 118 50 108 80 108 C110 108 135 118 135 160 Z" fill="url(#suitGrad)"/>
  <!-- Shirt & Tie -->
  <polygon points="80,108 70,126 80,148 90,126" fill="#f8fafc"/>
  <polygon points="78,126 82,126 83,150 80,155 77,150" fill="#0284c7"/>

  <!-- Neck -->
  <rect x="71" y="90" width="18" height="22" fill="#fbcfe8" rx="4"/>

  <!-- Head -->
  <ellipse cx="80" cy="68" rx="26" ry="32" fill="#fed7aa"/>

  <!-- Hair (Distinguished graying hair) -->
  <path d="M54 62 C53 40 65 32 80 32 C95 32 107 40 106 62 C101 44 91 40 80 40 C69 40 59 44 54 62 Z" fill="#94a3b8"/>

  <!-- Glasses -->
  <rect x="63" y="60" width="14" height="10" rx="2.5" fill="none" stroke="#0f172a" stroke-width="2"/>
  <rect x="83" y="60" width="14" height="10" rx="2.5" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="77" y1="64" x2="83" y2="64" stroke="#0f172a" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="70" cy="65" r="2" fill="#0f172a"/>
  <circle cx="90" cy="65" r="2" fill="#0f172a"/>

  <!-- Smile -->
  <path d="M74 84 Q80 89 86 84" fill="none" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
</svg>
